name: cycling
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.15   # 3.15: conda-forge pip-api 0.0.34 imports the removed sre_constants, so pip-audit crashes; lift once conda-forge has pip-api>=0.0.35
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - adjusttext>=1.0
  - rasterio>=1.3
  - pyproj>=3.6
  - requests>=2.31
  - py7zr>=0.21
  - pyshp>=2.3
  - pyyaml>=6.0
  - pytest>=7.4
  # Dev tools that `just ci` and CI run: coverage floor, lint + SAST, dependency CVE scan.
  - pytest-cov>=5.0
  - ruff>=0.15
  - pip-audit>=2.7
  - filelock>=3.0   # pip-audit's HTTP cache needs it; conda-forge's pip-audit doesn't pull it in
  - pip
  - pip:
    - fitparse>=1.2
    # TrainingPeaks MCP server (the `trainingpeaks` MCP in Claude Code). Pinned to a commit on
    # fmasi's fork: upstream main + reviewed community PRs the maintainer hasn't merged
    # (#161 #165 #168 #173 #178 #182 #183). Not on PyPI, so pip-audit skips it.
    - "tp-mcp[browser] @ git+https://github.com/fmasi/trainingpeaks-mcp.git@8f5f8c6056d47b361a1c40aa7bbf7345ed058ee5"
