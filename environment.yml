name: cycling
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - adjusttext>=1.0
  - rasterio>=1.3
  - pyproj>=3.6
  - requests>=2.31
  - py7zr>=0.21
  - pyshp>=2.3
  - pyyaml>=6.0
  - pytest>=7.4
  # Dev tools that `just ci` and CI run: coverage floor, lint + SAST, dependency CVE scan.
  - pytest-cov>=5.0
  - ruff>=0.15
  - pip-audit>=2.7
  - filelock>=3.0   # pip-audit's HTTP cache needs it; conda-forge's pip-audit doesn't pull it in
  - pip
  - pip:
    - fitparse>=1.2
