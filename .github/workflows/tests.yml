name: tests

# The repo's CI: gitleaks, then `just ci` (ruff lint + SAST, workflow lint, the test
# suite with its coverage floor, pip-audit), all in ONE job. Hand-written rather than a
# fmasi/.github just-ci.yml caller because the env is conda (environment.yml), which
# just-ci.yml can't set up. The gitleaks/actionlint/zizmor pins match just-ci.yml's.
#
# No paths / paths-ignore: `pytest` is a required check, and a PR filtered out of this
# workflow would wait for it forever (CHEATSHEET R7).
on:
  push:
    branches: [main]   # post-merge CI: the backstop for the ruleset's strict=false (R12)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:   # check name: `pytest` (required by the ruleset)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      # Pinned by version and by the sha256 of the linux release asset, as in
      # fmasi/.github just-ci.yml.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    defaults:
      run:
        # Login shell so the micromamba-activated `cycling` env is on PATH.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the commits this event brings
          persist-credentials: false

      - name: Install gitleaks, actionlint and zizmor
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          fetch() {  # url sha256 member
            local f="$RUNNER_TEMP/dl.tar.gz"
            curl -fsSL --retry 3 -o "$f" "$1"
            echo "$2  $f" | sha256sum -c -
            tar -xzf "$f" -C "$bin" "$3"
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256" gitleaks
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" actionlint
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256" zizmor
          echo "$bin" >> "$GITHUB_PATH"

      # PR: base..head, push: before..after; the full history when there is no usable
      # range (a new branch, a force-push). Redacted. Same logic as just-ci.yml.
      - name: Scan for secrets (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          base="" head=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" head="$PR_HEAD_SHA" ;;
            push)         base="$PUSH_BEFORE" head="$PUSH_AFTER" ;;
          esac
          args=(git --no-banner --redact --verbose)
          if [ -n "$base" ] && [ -n "$head" ] && [[ ! "$base" =~ ^0+$ ]] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null \
             && git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "Scanning ${base}..${head}"
            args+=(--log-opts="${base}..${head}")
          else
            echo "No usable commit range for '$EVENT_NAME'; scanning the full history."
          fi
          gitleaks "${args[@]}" .

      - name: Set up the cycling conda env
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: just ci
        env:
          CONDA_RUN: ""   # the env is already active in this login shell
          # Read-only token: zizmor's online audits query public GitHub data with it.
          GH_TOKEN: ${{ github.token }}
        run: just ci
